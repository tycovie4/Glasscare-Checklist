<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glazing Technician Master Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .checklist-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        input[type="checkbox"] {
            /* Custom checkbox styling */
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.25rem;
            border: 2px solid #3b82f6;
            background-color: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        input[type="checkbox"]:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div class="checklist-container">
        <header class="text-center py-6 bg-white rounded-lg mb-6 card">
            <h1 class="text-3xl font-bold text-blue-700">Glazing Tech Master Checklist</h1>
            <p id="user-info" class="text-sm text-gray-500 mt-1">Status: Offline (Needs Config)</p>
            <div id="loading" class="mt-4 text-blue-500 hidden">Loading Checklist...</div>
        </header>

        <div id="checklist-renderer" class="space-y-6">
            <!-- Checklist will be rendered here -->
        </div>

        <footer class="text-center py-4 text-gray-500 text-sm mt-6">
            <p>Job ID: <span id="job-id-display" class="font-mono bg-gray-200 px-2 py-1 rounded-md text-xs">Loading...</span></p>
            <p class="mt-2 text-xs">Data saved in real-time to Firestore.</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // REMOVED getAuth and signInAnonymously import
        import { getFirestore, doc, onSnapshot, setDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- IMPORTANT: CONFIGURE FIREBASE HERE ---

        const firebaseConfig = { // apiKey: "AIzaSyCIGmk3O--y3XaMrD-ZzkhZ-d9WD9ta-6k", authDomain: "glasscare-checklist.firebaseapp.com", projectId: "glasscare-checklist", storageBucket: "glasscare-checklist.firebasestorage.app", messagingSenderId: "959017527739", appId: "1:959017527739:web:a3c64dc09af4536ed6bc9e" };
        
        // --- GLOBAL VARIABLES & CONFIG ---
        const isExternalHost = (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY_GOES_HERE");
        const isCanvasHost = typeof __firebase_config !== 'undefined' && Object.keys(JSON.parse(__firebase_config)).length > 0;

        let finalConfig = {};
        let finalAppId = 'default-app-id';

        if (isCanvasHost) {
            finalConfig = JSON.parse(__firebase_config);
            finalAppId = typeof __app_id !== 'undefined' ? __app_id : finalConfig.projectId;
        } else if (isExternalHost) {
            finalConfig = firebaseConfig;
            finalAppId = firebaseConfig.projectId;
        } else {
            console.warn("Firebase configuration is missing. Data saving will be disabled.");
            document.getElementById('user-info').textContent = "Status: OFFLINE (No data saving)";
        }
        
        let db;
        // Removed auth
        let userId = 'single-static-user-id'; // HARDCODED for non-auth simplicity
        let isReadyToSave = false;

        // Use a static ID for the single checklist document (Job ID)
        const JOB_ID = 'job-2025-09-15-partition-install';

        // Checklist structure (template)
        const CHECKLIST_TEMPLATE = [
            {
                id: 'prep-0', title: "I. Prep Day: Material Gathering & Inspection", items: [
                    { id: 'p0-1', name: "Pickup necessary materials from vendors" },
                    { id: 'p0-2', name: "Check miscellaneous finish items (sweeps, seals, caulk)" }
                ]
            },
            {
                id: 'doc-1', title: "II. On-Site Documentation & Core Materials Check", items: [
                    { id: 'd1-1', name: "Approved Shop Drawings (latest revision)" },
                    { id: 'd1-2', name: "Hardware List (all fittings confirmed)" }
                ]
            },
            {
                id: 'photo-2', title: "III. Installation Completion & Photo Evidence", items: [
                    { id: 'p2-1', name: "Before Pictures taken of the opening" },
                    { id: 'p2-2', name: "After Pictures taken of the finished work" }
                ]
            },
            {
                id: 'close-3', title: "IV. Client Handover & Acceptance", items: [
                    { id: 'c3-1', name: "Client Walkthrough & Demonstration" },
                    { id: 'c3-2', name: "Client Sign-Off on Acceptance Form" }
                ]
            }
        ];
        
        // --- FIREBASE INITIALIZATION ---
        
        const startFirebaseConnection = () => {
            setLogLevel('Debug');
            
            try {
                const app = initializeApp(finalConfig);
                db = getFirestore(app);
                
                document.getElementById('job-id-display').textContent = JOB_ID;
                document.getElementById('user-info').textContent = `User ID: ${userId} | Status: Ready (Simple Mode)`;
                isReadyToSave = true; // Set flag to allow saving
                startChecklistListener();
            } catch (error) {
                console.error("Firebase Connection Error:", error);
                document.getElementById('user-info').textContent = `Status: FAILED (Check keys and console)`;
            }
        };


        if (Object.keys(finalConfig).length > 0) {
            startFirebaseConnection();
        }
        
        // --- UI RENDERING (ALWAYS RUNS) ---
        renderChecklist({});
        

        // --- FIREBASE OPERATIONS ---

        const getChecklistDocRef = () => {
            // Updated path to use a non-user-specific location for simple mode: /artifacts/{appId}/public/data/glazing_checklists/{JOB_ID}
            // NOTE: We are intentionally using the public path here to bypass security rules associated with authenticated users.
            return doc(db, 'artifacts', finalAppId, 'public', 'data', 'glazing_checklists', JOB_ID);
        };

        async function updateChecklistItem(itemId, isChecked) {
            if (!isReadyToSave || !db) {
                console.warn("Cannot save: Firebase not connected.");
                return;
            }
            const docRef = getChecklistDocRef();
            if (!docRef) return;

            const updateData = {};
            updateData[`status.${itemId}`] = isChecked;

            try {
                await setDoc(docRef, updateData, { merge: true });
                console.log(`Updated item ${itemId}: ${isChecked}`);
            } catch (e) {
                console.error("Error updating document: ", e);
            }
        }

        function startChecklistListener() {
            if (!isReadyToSave || !db) return;

            const docRef = getChecklistDocRef();
            if (!docRef) return;

            document.getElementById('loading').classList.remove('hidden');

            onSnapshot(docRef, (docSnap) => {
                document.getElementById('loading').classList.add('hidden');
                let savedStatus = {};

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    savedStatus = data.status || {};
                    console.log("Current checklist status loaded:", savedStatus);
                } else {
                    console.log("No existing checklist found. Initializing...");
                }

                renderChecklist(savedStatus);
            }, (error) => {
                console.error("Error listening to checklist updates:", error);
                document.getElementById('loading').textContent = "Error loading data.";
            });
        }

        // --- UI RENDERING ---

        function renderChecklist(savedStatus) {
            const container = document.getElementById('checklist-renderer');
            if (container.children.length > 0 && Object.keys(savedStatus).length === 0) {
                return; 
            }
            container.innerHTML = ''; // Clear existing content

            CHECKLIST_TEMPLATE.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'card bg-white p-5 rounded-xl mb-6';
                sectionEl.innerHTML = `<h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">${section.title}</h2>`;

                const ul = document.createElement('ul');
                ul.className = 'space-y-3';

                section.items.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.className = 'flex items-center justify-between p-2 rounded-lg transition duration-150 ease-in-out hover:bg-blue-50';

                    const isChecked = !!savedStatus[item.id];
                    
                    listItem.innerHTML = `
                        <label for="${item.id}" class="flex items-center w-full cursor-pointer">
                            <input type="checkbox" id="${item.id}" ${isChecked ? 'checked' : ''} class="mr-4 flex-shrink-0">
                            <span class="text-gray-700 text-sm md:text-base ${isChecked ? 'line-through text-gray-500' : ''}">${item.name}</span>
                        </label>
                    `;
                    
                    const checkbox = listItem.querySelector(`#${item.id}`);
                    checkbox.addEventListener('change', (e) => {
                        const textSpan = listItem.querySelector('span');
                        if (e.target.checked) {
                            textSpan.classList.add('line-through', 'text-gray-500');
                        } else {
                            textSpan.classList.remove('line-through', 'text-gray-500');
                        }
                        updateChecklistItem(item.id, e.target.checked);
                    });

                    ul.appendChild(listItem);
                });

                sectionEl.appendChild(ul);
                container.appendChild(sectionEl);
            });
        }
    </script>
</body>
</html>
