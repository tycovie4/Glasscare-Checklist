<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glazing Technician Master Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .checklist-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        input[type="checkbox"] {
            /* Custom checkbox styling */
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.25rem;
            border: 2px solid #3b82f6;
            background-color: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        input[type="checkbox"]:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* Style for the reset button */
        #reset-button {
            transition: background-color 0.15s ease-in-out;
        }
        #reset-button:hover {
            background-color: #ef4444; /* red-500 */
        }
    </style>
</head>
<body>

    <div class="checklist-container">
        <header class="text-center py-6 bg-white rounded-lg mb-6 card">
            <h1 class="text-3xl font-bold text-blue-700">Glazing Tech Master Checklist</h1>
            <p id="user-info" class="text-sm text-gray-500 mt-1">Status: Ready (Local Save)</p>
            <button id="reset-button" class="mt-3 px-4 py-2 bg-red-600 text-white text-sm font-semibold rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-75">
                Reset Checklist
            </button>
        </header>

        <div id="checklist-renderer" class="space-y-6">
            <!-- Checklist will be rendered here -->
        </div>

        <footer class="text-center py-4 text-gray-500 text-sm mt-6">
            <p>Data saved instantly in your browser (Local Storage).</p>
        </footer>
    </div>

    <script>
        // Use a static key for Local Storage
        const STORAGE_KEY = 'glazingChecklistStatus';

        // Checklist structure (template)
        const CHECKLIST_TEMPLATE = [
            {
                id: 'prep-0', title: "I. Prep Day: Material Gathering & Inspection", items: [
                    { id: 'p0-1', name: "Pickup necessary materials from vendors" },
                    { id: 'p0-2', name: "Check miscellaneous finish items (sweeps, seals, caulk)" }
                ]
            },
            {
                id: 'doc-1', title: "II. On-Site Documentation & Core Materials Check", items: [
                    { id: 'd1-1', name: "Approved Shop Drawings (latest revision)" },
                    { id: 'd1-2', name: "Hardware List (all fittings confirmed)" }
                ]
            },
            {
                id: 'photo-2', title: "III. Installation Completion & Photo Evidence", items: [
                    { id: 'p2-1', name: "Before Pictures taken of the opening" },
                    { id: 'p2-2', name: "After Pictures taken of the finished work" }
                ]
            },
            {
                id: 'close-3', title: "IV. Client Handover & Acceptance", items: [
                    { id: 'c3-1', name: "Client Walkthrough & Demonstration" },
                    { id: 'c3-2', name: "Client Sign-Off on Acceptance Form" }
                ]
            }
        ];
        
        // --- LOCAL STORAGE OPERATIONS ---

        function loadChecklistStatus() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                return storedData ? JSON.parse(storedData) : {};
            } catch (e) {
                console.error("Error loading status from Local Storage:", e);
                return {};
            }
        }

        function saveChecklistStatus(status) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
            } catch (e) {
                console.error("Error saving status to Local Storage:", e);
            }
        }
        
        function updateChecklistItem(itemId, isChecked) {
            const status = loadChecklistStatus();
            if (isChecked) {
                status[itemId] = true;
            } else {
                delete status[itemId];
            }
            saveChecklistStatus(status);
        }

        function resetChecklist() {
            const confirmation = window.confirm("Are you sure you want to reset the checklist? All saved progress will be lost.");
            if (confirmation) {
                localStorage.removeItem(STORAGE_KEY);
                renderChecklist({}); // Re-render with empty status
            }
        }
        
        // --- UI RENDERING ---

        function renderChecklist(savedStatus) {
            const container = document.getElementById('checklist-renderer');
            container.innerHTML = ''; // Clear existing content

            CHECKLIST_TEMPLATE.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'card bg-white p-5 rounded-xl mb-6';
                sectionEl.innerHTML = `<h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">${section.title}</h2>`;

                const ul = document.createElement('ul');
                ul.className = 'space-y-3';

                section.items.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.className = 'flex items-center justify-between p-2 rounded-lg transition duration-150 ease-in-out hover:bg-blue-50';

                    const isChecked = !!savedStatus[item.id];
                    
                    listItem.innerHTML = `
                        <label for="${item.id}" class="flex items-center w-full cursor-pointer">
                            <input type="checkbox" id="${item.id}" ${isChecked ? 'checked' : ''} class="mr-4 flex-shrink-0">
                            <span class="text-gray-700 text-sm md:text-base ${isChecked ? 'line-through text-gray-500' : ''}">${item.name}</span>
                        </label>
                    `;
                    
                    const checkbox = listItem.querySelector(`#${item.id}`);
                    
                    // Attach event listener
                    checkbox.addEventListener('change', (e) => {
                        const isChecked = e.target.checked;
                        const textSpan = listItem.querySelector('span');
                        
                        // Update visual state
                        if (isChecked) {
                            textSpan.classList.add('line-through', 'text-gray-500');
                        } else {
                            textSpan.classList.remove('line-through', 'text-gray-500');
                        }
                        
                        // Update local storage
                        updateChecklistItem(item.id, isChecked);
                    });

                    ul.appendChild(listItem);
                });

                sectionEl.appendChild(ul);
                container.appendChild(sectionEl);
            });
        }
        
        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const initialStatus = loadChecklistStatus();
            renderChecklist(initialStatus);
            
            // Attach reset button listener (using window.confirm since it's a local app)
            document.getElementById('reset-button').addEventListener('click', resetChecklist);
        });
    </script>
</body>
</html>
